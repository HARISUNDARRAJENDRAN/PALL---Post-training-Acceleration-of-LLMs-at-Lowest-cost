name: PALL runner audit

on:
  workflow_dispatch:
  push:
    branches:
      - agent/reasoning-sft-rebuild
    paths:
      - ".github/workflows/pall-runner-audit.yml"
      - "scripts/runner_audit.ps1"

permissions:
  contents: write

env:
  PALL_WORK_ROOT: C:\PALL_DATA

jobs:
  audit:
    if: github.ref == 'refs/heads/agent/reasoning-sft-rebuild'
    runs-on: [self-hosted, Windows, X64, pall, dataset-rebuild]
    timeout-minutes: 15

    steps:
      - name: Checkout controlled branch
        uses: actions/checkout@v4
        with:
          ref: agent/reasoning-sft-rebuild
          persist-credentials: true

      - name: Run environment audit
        shell: pwsh
        run: |
          ./scripts/runner_audit.ps1 -WorkRoot $env:PALL_WORK_ROOT

      - name: Commit sanitized audit report
        if: always()
        shell: pwsh
        run: |
          if (Test-Path "reports/runner-audit/runner_audit.json") {
            git config user.name "pall-runner-bot"
            git config user.email "pall-runner-bot@users.noreply.github.com"
            git add reports/runner-audit/runner_audit.json
            git diff --cached --quiet
            if ($LASTEXITCODE -ne 0) {
              git commit -m "chore: update runner audit report [skip ci]"
              git push origin HEAD:agent/reasoning-sft-rebuild
            }
          }

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pall-runner-audit-${{ github.run_id }}
          path: reports/runner-audit/runner_audit.json
          if-no-files-found: warn
          retention-days: 7
